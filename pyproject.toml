[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundcheck"
version = "0.2.0"
description = "A RAG agent that verifies its own citations: citation-support verification (similarity + number rules + a local NLI contradiction veto) with measured precision/recall, confidence flagging, and search fallback repair."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
dependencies = [
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "torch>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
